# Runs the generator checks on every pull request, and on main itself — work
# lands here by fast-forward as often as it does by PR, and a trigger that only
# fires on pull requests means the branch everything deploys from is the one
# branch nothing checks.
#
# A push to a branch with a pull request open is already covered by the
# pull_request trigger, so this is scoped to main rather than to every branch,
# or every such push would run the suite twice.
#
# There is no build and no dependencies: the checks import js/ directly and
# stub the two CDN imports at resolve time, so this is Node and a checkout.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # registerHooks, which test/loader.mjs uses to stub the CDN imports in
      # process, landed in 22.15 — pinning the major is not enough. This is the
      # Node the checks run on, and is unrelated to the Node the actions
      # themselves run on, which the runner decides.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16"

      - name: Run the checks
        run: node test/run.mjs
