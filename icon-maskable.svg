<!-- maskable: the mark sits inside the safe circle, so Android can crop it to
     any shape without clipping the wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="the woodshed">
  <rect width="512" height="512" fill="#0f1216"/>
  <rect x="146" y="146" width="130" height="130" fill="#f08a24"/>
  <text x="176" y="366" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="120" fill="#f2e7d3">w.</text>
</svg>
